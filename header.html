<!-- ============================================================
     SALLY GRAY PHOTOGRAPHY — SITE HEADER
     Paste this entire file into Squarespace: Settings > Advanced >
     Code Injection > Header. It is injected on EVERY page, so it
     only holds sitewide things: the design system (fonts, color
     tokens, shared component styles) and the nav itself.

     Page files (index.html, about.html, ...) assume this is already
     present — they do not redeclare any of it.
============================================================ -->

<!-- ── STRUCTURED DATA (LocalBusiness + FAQPage) ──
     Mirrors the FAQ content in about.html verbatim. Helps Google/AI search
     engines identify this as a Brevard, NC wedding photographer and surface
     the FAQ directly in rich results / AI answers. Update the FAQPage
     entries here if the FAQ copy on about.html ever changes. -->
<script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://www.sallygrayphoto.com/#business",
          "name": "Sally Gray Photography",
          "image": "https://github.com/ct-analytica/SallyGrayPhotography/blob/main/designs/Logo.png?raw=true",
          "url": "https://www.sallygrayphoto.com/",
          "description": "Western North Carolina wedding and lifestyle photographer based in Brevard, NC, blending documentary storytelling with an editorial eye across both film and digital.",
          "priceRange": "$700-$6000",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Brevard",
            "addressRegion": "NC",
            "addressCountry": "US"
          },
          "areaServed": [
            {
              "@type": "Place",
              "name": "Brevard, NC"
            },
            {
              "@type": "Place",
              "name": "Blue Ridge Mountains"
            },
            {
              "@type": "Place",
              "name": "Asheville, NC"
            },
            {
              "@type": "Place",
              "name": "Hendersonville, NC"
            },
            {
              "@type": "Place",
              "name": "Cashiers, NC"
            }
          ],
          "sameAs": [
            "https://www.instagram.com/sallygrayphotography/"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://www.sallygrayphoto.com/about#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Where are you based, and where do you photograph weddings?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "I'm a Western North Carolina wedding and lifestyle photographer based in Brevard, NC, photographing celebrations throughout the Blue Ridge Mountains, Asheville, Hendersonville, Cashiers, and beyond. I love working with couples who are drawn to meaningful places, beautiful landscapes, and photographs that feel like a true reflection of who they are. Whether your wedding day is at a luxe venue, tucked away in the woods, at home with your favorite people, or somewhere completely unexpected — I'm in."
              }
            },
            {
              "@type": "Question",
              "name": "What is your photography style?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "My work blends a documentary approach with an editorial eye. I'm drawn to natural moments, thoughtful details, movement, and all the little in-between pieces that become the memories you treasure most. I also have an inner art brat who absolutely lives for a beautifully posed group shot, unusual framing, and those unexpected visual moments that make an image feel like art. I'll guide you when you need it — especially during portraits! — but I never want your photos to feel like a performance. My goal is for you to feel comfortable, present, and completely yourself."
              }
            },
            {
              "@type": "Question",
              "name": "Do you photograph weddings with film?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! As much as possible. I love incorporating film photography because of its timeless colors, softness, and nostalgic feeling. Digital cameras shine in places where film can struggle, so I use both mediums together to create a complete story of your day. My digital editing style is inspired by my film scans: warm, natural, and true-to-life, with an emphasis on preserving the atmosphere and emotion of your wedding."
              }
            },
            {
              "@type": "Question",
              "name": "How far in advance should we book our wedding photographer?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most couples book 12–18 months in advance, especially for popular spring and fall dates in Western North Carolina. That said, I've photographed some wonderful weddings booked only 6–8 months out. If your date is approaching, reach out anyway — I'd love to see if we're a good fit."
              }
            },
            {
              "@type": "Question",
              "name": "How many hours of wedding photography coverage do we need?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most single-day weddings include 6–10 hours of coverage, but every celebration is different. I also love multi-day weddings, welcome parties, and weekend-long experiences. Whether you're planning an intimate elopement or a full celebration with all your favorite people, I'll help you choose coverage that fits your story — not a cookie-cutter package."
              }
            },
            {
              "@type": "Question",
              "name": "Do you help with wedding photography timelines?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely. Creating a relaxed, intentional timeline is one of my favorite parts of the process. I'll help you think through light, weather, travel time, family portraits, and all the moments that matter. My goal is for photography to quietly add to your experience — not make you feel rushed, stressed, or staged."
              }
            },
            {
              "@type": "Question",
              "name": "Do you travel for weddings and sessions?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! I'm available worldwide, with travel fees that won't require taking out a mortgage. I especially love mountain weddings, outdoor celebrations, and locations with a strong sense of place. Family homes and small venues are just as spectacular to me as sprawling estates and gilded yachts. If you have a dream location, I want to hear about it."
              }
            },
            {
              "@type": "Question",
              "name": "Do you photograph engagement sessions?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! Engagement sessions are one of my favorite ways to work together before your wedding day. Wedding clients receive an exclusive discount on engagement sessions, and I love using this time to help you feel comfortable in front of the camera before the big day."
              }
            },
            {
              "@type": "Question",
              "name": "What should we wear for our session?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The best outfits are the ones that make you feel confident and comfortable. I love clothing with movement, texture, and colors that feel natural in your environment. For Western North Carolina sessions, earthy tones, soft layers, and timeless pieces photograph beautifully. Punchy colors and bold silhouettes are a fun and stylish choice as well! I'm always happy to help with outfit ideas and location planning."
              }
            },
            {
              "@type": "Question",
              "name": "Do you photograph families and couples outside of weddings?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! I photograph families, couples, maternity sessions, portraits, and everyday seasons of life. My approach is relaxed and connection-focused. I'm not interested in forcing perfect smiles — although I'm pretty good at coaxing them out of even the grumpiest toddler. I want to capture the relationships, personalities, and little moments that make your family yours."
              }
            },
            {
              "@type": "Question",
              "name": "What happens after our session or wedding?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "After your session or wedding, I hand-select and edit your digital images with my signature warm, timeless style. You'll receive sneak peeks within 72 hours of your session. Weddings are delivered within 8–12 weeks, and all other sessions are delivered within 4 weeks. While I'm working on the digital side, professional film labs are carefully developing and scanning your film. Your final gallery will be delivered through an online platform where you can view, download, share, and print your images. Printing rights are always included."
              }
            },
            {
              "@type": "Question",
              "name": "Why should we choose Sally Gray Photography?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "I could tell you about my years of experience, gear list, archives, or the pretty pictures you'll find throughout my website. But here's what I hear again and again from clients, vendors, and fellow photographers: I thrive in chaos. Wedding days are beautiful because they're real — and real things happen. When your timeline shifts, the weather changes, or something unexpected pops up, I'll keep things positive, creative, and fun. You focus on getting married. I'll make sure you look and feel amazing doing it. My approach is playful and calm, intentional and rooted in connection. I'll guide you when you need it, step back when you don't, and make sure your experience feels just as meaningful as the photographs themselves."
              }
            },
            {
              "@type": "Question",
              "name": "What does photography cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Wedding collections begin at $4,000, with most couples investing between $4,800–$6,000. Family sessions begin at $700. All collections include film photography, printing rights, and planning assistance. These aren't add-ons — they're part of the experience I believe every client deserves."
              }
            },
            {
              "@type": "Question",
              "name": "Do you offer payment plans?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Girl yes. In this economy?? I love a pay-in-four option as much as the next person, and I'm happy to create custom payment plans for wedding photography. Family and portrait sessions can also be split into two payments for those who need a little more flexibility. If you're excited to work together but feeling nervous about the investment, reach out. Let's talk."
              }
            }
          ]
        }
      ]
    }
</script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Raleway:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --terracotta: #C96848;
        --cream:      #F0E4D2;
        --green:      #2D4A3D;
        --gold:       #DEB96A;
        --bg:         #F2EBE0;
        --text-dark:  #2D4A3D;
        --text-mid:   #5C524A;
        --text-light: #9A8E84;
        --white:      #FDFAF6;
        --serif:      'Playfair Display', Georgia, serif;
        --sans:       'Raleway', Helvetica, sans-serif;
        --max-w:      1200px;
    }

    html { scroll-behavior: smooth; }

    body {
        background: var(--bg);
        color: var(--text-dark);
        font-family: var(--sans);
        font-weight: 400;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        cursor: none; /* hide default cursor on desktop — custom dot cursor below */
    }
    @media (max-width: 768px) { body { cursor: auto; } }

    img { max-width: 100%; height: auto; display: block; }

    /* ── CUSTOM CURSOR ── */
    .custom-cursor {
        position: fixed;
        width: 10px; height: 10px;
        background: var(--terracotta);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: transform 0.15s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
        mix-blend-mode: multiply;
    }
    .custom-cursor.big {
        width: 48px; height: 48px;
        background: rgba(201, 104, 72, 0.15);
        border: 1px solid var(--terracotta);
    }
    @media (max-width: 768px) { .custom-cursor { display: none; } }

    /* ── NAVIGATION ── */
    nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        padding: 20px 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: background 0.4s ease, padding 0.4s ease, border-color 0.4s ease;
        border-bottom: 1px solid transparent;
    }
    nav.scrolled {
        background: rgba(242, 235, 224, 0.95);
        backdrop-filter: blur(12px);
        padding: 14px 48px;
        border-color: rgba(45, 74, 61, 0.1);
    }

    .nav-logo {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 14px;
        line-height: 1;
    }
    .nav-logo-img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex-shrink: 0;
        transition: opacity 0.3s;
    }
    .nav-logo-img:hover { opacity: 0.8; }
    .nav-logo-text { display: flex; flex-direction: column; }
    .nav-logo .n { display: block; font-family: var(--serif); font-size: 1.55rem; color: var(--green); letter-spacing: -0.01em; }
    .nav-logo .s { display: block; font-family: var(--sans); font-size: 0.56rem; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--green); margin-top: 3px; }

    .nav-links { display: flex; gap: 44px; list-style: none; }
    .nav-links a {
        font-size: 0.66rem; font-weight: 600; letter-spacing: 0.2em;
        text-transform: uppercase; text-decoration: none;
        color: var(--green); transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.5; }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
    .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--green); }

    .mob-nav {
        display: none; position: fixed; inset: 0;
        background: var(--bg); z-index: 99;
        flex-direction: column; align-items: center; justify-content: center; gap: 44px;
    }
    .mob-nav.open { display: flex; }
    .mob-nav a { font-family: var(--serif); font-size: 2.5rem; color: var(--green); text-decoration: none; }
    .mob-close { position: absolute; top: 24px; right: 40px; background: none; border: none; font-family: var(--serif); font-size: 2.2rem; color: var(--green); cursor: pointer; }

    /* ── SHARED TYPOGRAPHY / LAYOUT UTILITIES (used by every page) ── */
    .sec { padding: 108px 48px; }
    .sec-inner { max-width: var(--max-w); margin: 0 auto; }

    .label { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--terracotta); margin-bottom: 14px; display: block; }
    .h2 { font-family: var(--serif); font-size: clamp(1.9rem, 3.5vw, 2.9rem); font-weight: 400; color: var(--green); line-height: 1.22; margin-bottom: 28px; }
    .h2 em { font-style: italic; }
    .rule { width: 46px; height: 1px; background: var(--terracotta); margin-bottom: 40px; }

    /* ── SHARED BUTTONS ── */
    .btn {
        display: inline-block;
        font-family: var(--sans); font-size: 0.62rem; font-weight: 600;
        letter-spacing: 0.26em; text-transform: uppercase; text-decoration: none;
        padding: 16px 38px; border: 1.5px solid var(--green);
        color: var(--green); background: transparent; cursor: pointer;
        transition: background 0.3s, color 0.3s;
    }
    .btn:hover { background: var(--green); color: var(--cream); }
    .btn-fill { background: var(--green); color: var(--cream); }
    .btn-fill:hover { background: transparent; color: var(--green); }
    .btn-tc { border-color: var(--terracotta); color: var(--terracotta); }
    .btn-tc:hover { background: var(--terracotta); color: var(--cream); }

    /* ── BOTANICAL DIVIDER ── */
    .botanical-divider {
        display: flex; align-items: center; justify-content: center;
        padding: 0 48px; gap: 24px; overflow: hidden;
    }
    .botanical-divider-line { flex: 1; height: 1px; background: rgba(45,74,61,0.12); }
    .botanical-divider-img {
        height: 64px; width: auto; opacity: 0.75;
        object-fit: contain;
    }

    /* ── IMAGE PLACEHOLDER UTILITY (about/journal/portfolio all use this) ── */
    .img-ph { width: 100%; aspect-ratio: 3/4; background: var(--cream); border: 1px solid rgba(45,74,61,0.12); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-ph img { width: 100%; height: 100%; object-fit: cover; }
    .img-ph .ph-label { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-light); }

    /* ── SCROLL REVEAL (used by every page) ── */
    .r { opacity: 0; transform: translateY(28px); transition: opacity 0.75s ease, transform 0.75s ease; }
    .r.in { opacity: 1; transform: translateY(0); }
    .d1 { transition-delay: 0.1s; }
    .d2 { transition-delay: 0.2s; }
    .d3 { transition-delay: 0.3s; }
    .d4 { transition-delay: 0.4s; }

    /* ── RESPONSIVE (nav + shared layout only — page sections handle their own) ── */
    @media (max-width: 768px) {
        .sec { padding: 72px 24px; }
        nav { padding: 18px 24px; }
        nav.scrolled { padding: 12px 24px; }
        .nav-links { display: none; }
        .hamburger { display: flex; }
        .nav-logo .n { font-size: 1.25rem; }
    }
</style>

<!-- ── CUSTOM CURSOR ── -->
<div class="custom-cursor" id="cursor"></div>

<!--
    FALLBACK — DOUBLE HEADER FIX:
    If Squarespace's own template header (logo/nav from Design > Header)
    is still enabled, it can render underneath this custom nav and appear
    to "double up" once you scroll and this nav gets its opaque .scrolled
    background. Preferred fix: disable the native header in Design >
    Header so only this one renders. If your template doesn't offer that
    toggle, uncomment the rule below to force-hide it instead — swap in
    whatever selector actually wraps it (inspect the live page to confirm;
    #header / .Header are the common ones across templates).

    <style>#header, .Header { display: none !important; }</style>
-->

<!-- ── NAVIGATION ── -->
<nav id="main-nav">
    <a href="index.html" class="nav-logo">
        <img src="https://github.com/ct-analytica/SallyGrayPhotography/blob/main/designs/Logo.png?raw=true" alt="Sally Gray Photography" class="nav-logo-img">
        <div class="nav-logo-text">
            <span class="n">Sally Gray</span>
            <span class="s">Photography</span>
        </div>
    </a>
    <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="index.html#portfolio">Portfolio</a></li>
        <li><a href="index.html#experiences">Experiences</a></li>
        <li><a href="index.html#journal">Journal</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
</nav>

<div class="mob-nav" id="mob-nav">
    <button class="mob-close" id="mob-close" aria-label="Close menu">×</button>
    <a href="about.html" class="mob-link">About</a>
    <a href="index.html#portfolio" class="mob-link">Portfolio</a>
    <a href="index.html#experiences" class="mob-link">Experiences</a>
    <a href="index.html#journal" class="mob-link">Journal</a>
    <a href="index.html#contact" class="mob-link">Contact</a>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // ── CUSTOM CURSOR ──
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('big'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('big'));
    });

    // ── NAV SCROLL ──
    const nav = document.getElementById('main-nav');
    window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    // ── MOBILE NAV ──
    const hamburger = document.getElementById('hamburger');
    const mobNav    = document.getElementById('mob-nav');
    const mobClose  = document.getElementById('mob-close');
    hamburger.addEventListener('click', () => mobNav.classList.add('open'));
    mobClose.addEventListener('click',  () => mobNav.classList.remove('open'));
    document.querySelectorAll('.mob-link').forEach(a => {
        a.addEventListener('click', () => mobNav.classList.remove('open'));
    });

    // ── SCROLL REVEAL (applies to any .r element on any page) ──
    const ro = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); }
        });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.r').forEach(el => ro.observe(el));
    window.addEventListener('load', () => {
        document.querySelectorAll('#hero .r').forEach(el => el.classList.add('in'));
    });
});
</script>
